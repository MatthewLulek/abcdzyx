<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kettle &amp; Trail</title>
  <meta name="description" content="Personal tracker for kettlebell training, cardio and eating, with weekly, monthly and yearly charts.">
  <meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1317" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kettle &amp; Trail">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var d = JSON.parse(localStorage.getItem('kettle-trail:data:v1') || '{}');
      var t = d.settings && d.settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#today" aria-label="Kettle and Trail, go to Today">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-bell"/></svg>
        <span>Kettle &amp; Trail</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a href="#today" data-view-link="today"><svg aria-hidden="true"><use href="#i-today"/></svg><span>Today</span></a>
        <a href="#progress" data-view-link="progress"><svg aria-hidden="true"><use href="#i-chart"/></svg><span>Progress</span></a>
        <a href="#history" data-view-link="history"><svg aria-hidden="true"><use href="#i-list"/></svg><span>History</span></a>
        <a href="#settings" data-view-link="settings"><svg aria-hidden="true"><use href="#i-gear"/></svg><span>Settings</span></a>
      </nav>
      <button class="sync-pill" id="sync-pill" type="button" hidden data-action="sync-now" aria-live="polite">
        <span class="sync-dot"></span><span class="sync-text">Synced</span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section id="view-today" class="view" data-view="today" aria-label="Today"></section>
    <section id="view-progress" class="view" data-view="progress" aria-label="Progress" hidden></section>
    <section id="view-history" class="view" data-view="history" aria-label="History" hidden></section>
    <section id="view-settings" class="view" data-view="settings" aria-label="Settings" hidden></section>
  </main>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <form method="dialog" id="sheet-form" novalidate></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-bell" viewBox="0 0 32 32"><path fill="currentColor" d="M11 3.5h10a4.5 4.5 0 0 1 4.5 4.5v1.2a3 3 0 0 1-.6 1.8l-.7.9a10.5 10.5 0 1 1-16.4 0l-.7-.9a3 3 0 0 1-.6-1.8V8A4.5 4.5 0 0 1 11 3.5Zm0 3A1.5 1.5 0 0 0 9.5 8v1.1l.9 1.1a10.4 10.4 0 0 1 11.2 0l.9-1.1V8A1.5 1.5 0 0 0 21 6.5H11Z"/></symbol>
    <symbol id="i-today" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></g></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16V11M12 16V6M17 16v-3"/></g></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></g></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></g></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12.6 2.3c.3 2.6-.8 4.3-2.2 5.9C8.8 10 7 12 7 15a5 5 0 0 0 10 0c0-1.7-.6-3.1-1.4-4.3-.3 1.2-1 2-2 2.4.5-3.2-.4-6.6-1-10.8Z"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M10 9.5v10"/></g></symbol>
  </svg>

  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
